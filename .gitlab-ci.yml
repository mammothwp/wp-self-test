# Checks: syntax, composer.json, PHPUnit, PHPCS, PHPStan.
stages: [check]


workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^(develop|main)$/

variables:
  COMPOSER_CACHE_DIR: $CI_PROJECT_DIR/.cache/composer

cache:
  key:
    files: [composer.json]
  paths: [.cache/composer]

check:
  stage: check
  image: composer:2
  tags: [priority]
  script:
    - git ls-files -z -- '*.php' 'bin/run.php' 'bin/install-hooks' | xargs -0 -n1 php -l > /dev/null
    - composer validate --strict --no-check-lock
    - composer update --no-interaction --prefer-dist
    - vendor/bin/phpunit
    - vendor/bin/phpcs
    - vendor/bin/phpstan analyse --memory-limit=1G --no-progress

# Node side of the browser layer (e2e/): unit tests on saved HTML/console
# fixtures, plus the crawler against a fake site in real Chromium.
e2e:
  stage: check
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  tags: [priority]
  script:
    - npm install --no-save --no-audit --no-fund @playwright/test@1.64.1
    - npm test
