# GitLab is the only CI; GitHub is a push mirror. Same checks as the old
# GitHub lint workflow: syntax, composer.json, PHPUnit, PHPCS, PHPStan.
stages: [check]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  COMPOSER_CACHE_DIR: $CI_PROJECT_DIR/.cache/composer

cache:
  key:
    files: [composer.json]
  paths: [.cache/composer]

check:
  stage: check
  image: registry.gitlab.motivar.io/motivar/ci/unified:latest
  tags: [priority]
  script:
    - git ls-files -z -- '*.php' 'bin/run.php' 'bin/install-hooks' | xargs -0 -n1 php -l > /dev/null
    - composer validate --strict --no-check-lock
    - composer update --no-interaction --prefer-dist
    - vendor/bin/phpunit
    - vendor/bin/phpcs
    - vendor/bin/phpstan analyse --memory-limit=1G --no-progress
